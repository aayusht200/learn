<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        function fizzBuzz(number) {
            let fizzbuzz = [];
            for (let i = 1; i <= number; i++) {
                if (i % 3 == 0 && i % 5 == 0) {
                    fizzbuzz.push('FizzBuzz');
                }
                else if (i % 3 == 0) {
                    fizzbuzz.push('Fizz');
                }
                else if (i % 5 == 0) {
                    fizzbuzz.push('Buzz');
                }
                else {
                    fizzbuzz.push(i);
                }
            }
            console.log(fizzbuzz.join(','));
        }
    </script>
    <title>Document</title>
</head>
